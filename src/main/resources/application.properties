quarkus.http.port=8080
quarkus.http.host=127.0.0.1
%prod.quarkus.http.host=0.0.0.0
quarkus.http.cors.enabled=true
auth.cors.origins=${AUTH_CORS_ORIGINS:http://localhost:4200}
quarkus.http.cors.origins=${auth.cors.origins}
quarkus.http.cors.methods=GET,POST
quarkus.http.cors.headers=accept,authorization,content-type
quarkus.jackson.fail-on-unknown-properties=false
auth.db.url=${AUTH_DB_URL:jdbc:sqlite:./data/workshop.db}
auth.password.iterations=${AUTH_PASSWORD_ITERATIONS:600000}
auth.token.private-key=${AUTH_TOKEN_PRIVATE_KEY}
auth.token.issuer=workshop-auth-backend
auth.token.audience=workshop-api
auth.seed.student-password=${AUTH_SEED_STUDENT_PASSWORD:}
auth.seed.trainer-password=${AUTH_SEED_TRAINER_PASSWORD:}
